name: atelier
description: Préparer ses travaux sans erreur, coupes, quantités et budget d'un chantier.
publish_to: "none"
version: 0.3.0+3

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  # Dossier de l'application, où vit le fichier des chantiers
  path_provider: ^2.1.4
  # Fiche du chantier en PDF : plan, liste de courses et coupes
  pdf: ">=3.11.0 <4.0.0"
  printing: ">=5.14.0 <6.0.0"
  # Envoi de la liste de courses par message
  share_plus: ^13.3.1
  # Accéléromètre pour le niveau et l'inclinomètre, sans permission
  sensors_plus: ">=6.0.0 <8.0.0"
  # Photo d'une reprise, par l'appareil photo du téléphone
  image_picker: ">=1.1.0 <2.0.0"
  # Import d'un chantier exporté
  file_picker: ^13.3.3
  # Mode chantier : lecture à voix haute par le moteur du téléphone, écran gardé allumé
  flutter_tts: ^4.2.5
  wakelock_plus: ^1.8.2
  # Fin d'une attente (séchage, acclimatation) : notification programmée sur le téléphone
  # Moins de 23 : la 23 tire androidx.core 1.19, qui exige le SDK Android 37
  flutter_local_notifications: ">=21.0.0 <23.0.0"
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Icône et écran de démarrage, générés en CI dans le dossier android recréé
  flutter_launcher_icons: ">=0.14.0 <1.0.0"
  flutter_native_splash: ">=2.4.0 <3.0.0"

# Mètre ruban jaune sur vert sapin (assets/icon, dessinés par tool/dessiner_icone.py)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#1F5A3A"
  adaptive_icon_foreground: assets/icon/foreground.png

flutter_native_splash:
  color: "#1F5A3A"
  image: assets/icon/splash.png
  android_12:
    color: "#1F5A3A"
    image: assets/icon/foreground.png
  ios: false
  web: false

flutter:
  uses-material-design: true
  # Barlow (licence OFL, assets/fonts/OFL.txt), embarquée : l'appli n'a pas accès au réseau
  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
        - asset: assets/fonts/Barlow-Italic.ttf
          style: italic
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
    - family: BarlowSemiCondensed
      fonts:
        - asset: assets/fonts/BarlowSemiCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/BarlowSemiCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowSemiCondensed-Bold.ttf
          weight: 700
  # Textes générés depuis lib/l10n/app_fr.arb (voir l10n.yaml)
  generate: true
