name: Tests sur émulateur

# Parcours de integration_test/ lancés sur un vrai Android : stockage, chemins et
# greffons natifs que les tests de widgets ne voient pas. Plus lent, donc à part.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un nouveau commit sur la branche rend le passage précédent inutile : il est arrêté.
concurrency:
  group: emulateur-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  emulateur:
    name: Parcours sur émulateur
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Java 17
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      - name: Fichiers Android
        run: |
          flutter create --platforms=android --org fr.remiverhaeghe --project-name atelier .
          flutter pub get
          flutter gen-l10n

      # Même précaution que pour l'APK : coupure réseau pendant le téléchargement du NDK.
      - name: NDK Android
        run: |
          for vEssai in 1 2 3; do
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" > /dev/null && exit 0
            echo "Téléchargement du NDK interrompu, nouvel essai ($vEssai)"
            sleep 15
          done
          exit 1

      # Dépendances Gradle gardées d'un passage à l'autre : moins de téléchargements, donc moins
      # d'échecs réseau (erreurs 429 du dépôt Maven) et un passage plus court.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/app/build.gradle.kts', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      # Accélération matérielle de l'émulateur sur les machines Linux de GitHub
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Émulateur créé une fois puis gardé avec son instantané : il démarre en quelques secondes
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: avd
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-x86_64-google_apis

      - name: Instantané de l'émulateur
        if: steps.avd.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Instantané créé"

      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: flutter test integration_test/parcours_test.dart
