name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Une release publiée sur GitHub reçoit les APK construites depuis son tag
  release:
    types: [published]

permissions:
  contents: read

# Actions épinglées par empreinte de commit ; Dependabot propose les nouvelles versions.

# Sur une branche, un nouveau commit (la mise en forme automatique par exemple) rend les
# contrôles du précédent inutiles : ils sont arrêtés. Sur main et pour une release, jamais.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}

jobs:
  analyse:
    name: Analyse
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Installation des dépendances
        run: flutter pub get

      - name: Textes traduits
        run: flutter gen-l10n

      # Largeur des lignes fixée dans analysis_options.yaml ; en cas d'écart, le
      # diff affiché donne la forme attendue.
      - name: Vérification du formatage
        run: |
          dart format lib test
          git diff --exit-code -- lib test

      - name: Analyse du code
        run: flutter analyze

  # Les tests, longs, sont répartis sur trois machines qui tournent en même temps
  tests:
    name: Tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Installation des dépendances
        run: |
          flutter pub get
          flutter gen-l10n

      # Un seul fichier qui importe tous les tests : une compilation au lieu de 250
      - name: Tests et couverture
        run: |
          ./tool/tous_les_tests.sh
          flutter test --coverage --total-shards 3 --shard-index $(( ${{ matrix.shard }} - 1 )) test/tous_test.dart

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: couverture-${{ matrix.shard }}
          path: coverage/lcov.info
          if-no-files-found: error

  # Les règles de calcul (lib/logic) doivent être couvertes à 95 % au moins. Une ligne est
  # couverte si l'une des trois parts des tests l'a exécutée.
  couverture:
    name: Tests et analyse
    runs-on: ubuntu-latest
    needs: [analyse, tests]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: couverture-*
          path: coverage

      - name: Couverture des règles de calcul
        run: |
          if [ ! -d lib/logic ]; then echo "Pas encore de règles de calcul"; exit 0; fi
          cat coverage/*/lcov.info | awk -v vMin=95 '
            /^SF:/ { vFile = substr($0, 4); vKeep = (vFile ~ /^lib\/logic\//) }
            vKeep && /^DA:/ {
              split(substr($0, 4), vPart, ",")
              vKey = vFile ":" vPart[1]
              vSeen[vKey] = 1
              if (vPart[2] > 0) vHit[vKey] = 1
            }
            END {
              for (vKey in vSeen) vFound++
              for (vKey in vHit) vCovered++
              vPercent = vFound ? 100 * vCovered / vFound : 100
              printf "Couverture de lib/logic : %.1f %% (%d lignes sur %d), minimum %d %%\n", vPercent, vCovered, vFound, vMin
              exit (vPercent < vMin)
            }'

  # Version web installable sur l'iPhone depuis Safari, publiée sur GitHub Pages
  web:
    name: Version web
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Construction
        run: |
          flutter pub get
          # L'appli est servie sous /atelier/ : https://remiverhaeghe.github.io/atelier/
          flutter build web --release --base-href /atelier/
          python3 tool/service_worker.py build/web

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/web

  # Publiée seulement depuis main, une fois les tests passés
  pages:
    name: Publication web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [couverture, web]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  apk:
    name: APK Android
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.signature.outputs.signed }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Java 17
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      # Seuls build.gradle.kts et le manifeste sont versionnés : le reste du
      # dossier android (Gradle, icônes, MainActivity) est recréé ici.
      - name: Fichiers Android
        run: |
          flutter create --platforms=android --org fr.remiverhaeghe --project-name atelier .
          flutter pub get
          # Icône et écran de démarrage dans les ressources Android recréées
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      # Signature avec la clé personnelle si les secrets existent : l'APK remplace
      # alors celle installée. Sinon, clé de débogage.
      - name: Clé de signature
        id: signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            {
              echo "storePassword=$STORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=upload-keystore.jks"
            } > android/key.properties
            echo "Signature avec la clé personnelle"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Secrets absents : signature avec la clé de débogage"
          fi

      # Le NDK demandé par Gradle se télécharge pendant la construction ; une coupure réseau
      # la fait échouer au bout de 15 minutes. On l'installe avant, avec trois essais.
      - name: NDK Android
        run: |
          for vEssai in 1 2 3; do
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" > /dev/null && exit 0
            echo "Téléchargement du NDK interrompu, nouvel essai ($vEssai)"
            sleep 15
          done
          exit 1

      # Dépendances Gradle gardées d'un passage à l'autre, comme pour le test sur émulateur
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-apk-${{ runner.os }}-${{ hashFiles('android/app/build.gradle.kts', 'pubspec.yaml') }}
          restore-keys: gradle-apk-${{ runner.os }}-

      - name: Construction
        run: |
          flutter pub get
          # Hors de main et des releases, seule l'APK arm64 sert (contrôle des permissions) :
          # les deux autres architectures ne sont construites que pour être publiées
          vAbi=""
          if [ "$GITHUB_REF" != refs/heads/main ] && [ "$GITHUB_EVENT_NAME" != release ]; then
            vAbi="--target-platform android-arm64"
          fi
          # Numéro de construction croissant : Android refuse une mise à jour dont le
          # versionCode n'augmente pas
          flutter build apk --release --split-per-abi $vAbi --build-number="$GITHUB_RUN_NUMBER"
          # Le Play Store demande un bundle, pas une APK : construit pour les releases seulement
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            flutter build appbundle --release --build-number="$GITHUB_RUN_NUMBER"
            cp build/app/outputs/bundle/release/app-release.aab build/app/outputs/flutter-apk/atelier-release.aab
          fi

      # L'appli promet de ne rien envoyer : une dépendance qui ajouterait la permission Internet
      # au manifeste fusionné fait échouer la construction, de même qu'une permission non listée
      # dans docs/securite.md.
      - name: Permissions de l'APK
        run: |
          vAapt=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          vApk=$(ls build/app/outputs/flutter-apk/app-arm64-v8a-release.apk)
          "$vAapt" dump permissions "$vApk" | sed -n "s/.*name='\([^']*\)'.*/\1/p" | sort -u > permissions.txt
          cat permissions.txt
          if grep -qx 'android.permission.INTERNET' permissions.txt; then
            echo "::error::La permission INTERNET est apparue dans l'APK"
            exit 1
          fi
          # Les permissions expliquées sont écrites entre accents graves dans docs/securite.md
          vMissing=$(grep -v -x -F -f <(grep -o '`[A-Za-z0-9_.]*`' docs/securite.md | tr -d '`' | sort -u) permissions.txt || true)
          if [ -n "$vMissing" ]; then
            echo "::error::Permissions non expliquées dans docs/securite.md : $vMissing"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atelier-apk
          path: |
            build/app/outputs/flutter-apk/*-release.apk
            build/app/outputs/flutter-apk/*-release.aab
          if-no-files-found: error

  release:
    name: APK de la release
    runs-on: ubuntu-latest
    needs: [couverture, apk]
    if: github.event_name == 'release'
    # Seul ce job peut écrire, et seulement pour joindre les fichiers à la release
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: atelier-apk
          path: apk

      - name: Ajout des APK et du bundle à la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" apk/* --repo "$GITHUB_REPOSITORY" --clobber

  # Chaque fusion sur main publie l'APK dans une préversion « build-N » : Obtainium, sur le
  # téléphone, la voit et propose la mise à jour. Seulement avec la clé personnelle, sinon
  # chaque APK aurait une signature différente et ne remplacerait pas la précédente.
  derniere:
    name: Préversion pour Obtainium
    runs-on: ubuntu-latest
    needs: [couverture, apk]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.apk.outputs.signed == 'true'
    permissions:
      contents: write
    concurrency:
      group: preversion
      cancel-in-progress: false

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: atelier-apk
          path: apk

      - name: Publication et ménage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: build-${{ github.run_number }}
        run: |
          gh release create "$TAG" apk/*.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "Atelier, construction ${{ github.run_number }}" \
            --notes "APK construite depuis main ($GITHUB_SHA). Installation et mises à jour : README, section « Installer sur le téléphone »."
          # Les trois dernières préversions suffisent : les plus anciennes et leur tag sont supprimés
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease and (.tagName | startswith("build-")))] | .[3:] | .[].tagName' |
            while read -r vTag; do
              gh release delete "$vTag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            done

  secrets:
    name: Recherche de secrets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
