name: Captures Play Store

# Captures de la fiche Play Store prises sur un Android émulé (format téléphone),
# avec le chantier fictif de test/captures : elles suivent l'interface sans retouche.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "integration_test/captures_play_test.dart"
      - "test_driver/**"
      - ".github/workflows/captures-play.yml"

permissions:
  contents: read

jobs:
  captures:
    name: Captures sur émulateur
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Java 17
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      - name: Fichiers Android
        run: |
          flutter create --platforms=android --org fr.remiverhaeghe --project-name atelier .
          flutter pub get
          flutter gen-l10n

      - name: NDK Android
        run: |
          for vEssai in 1 2 3; do
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" > /dev/null && exit 0
            echo "Téléchargement du NDK interrompu, nouvel essai ($vEssai)"
            sleep 15
          done
          exit 1

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # 1080 × 1920 : le Play Store refuse un grand côté de plus de deux fois le petit
          profile: pixel_2
          disable-animations: true
          script: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/captures_play_test.dart

      # Aperçu dans le journal, lisible par l'API quand l'artefact ne l'est pas
      - name: Aperçu dans le journal
        if: always()
        run: |
          for vFile in build/captures-play/*.png; do
            echo "=== CAPTURE $(basename "$vFile" .png)"
            base64 -w 0 "$vFile"
            echo
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: captures-play-store
          path: build/captures-play/*.png
          if-no-files-found: warn
