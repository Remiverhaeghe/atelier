name: Captures

# Captures d'écran du chantier fictif (test/captures), en artefact : pour le
# README, la fiche Play Store et pour relire l'interface sans téléphone.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "lib/ui/**"
      - "lib/app.dart"
      - "lib/l10n/**"
      - "test/captures/**"
      - ".github/workflows/captures.yml"

permissions:
  contents: read

jobs:
  captures:
    name: Captures d'écran
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Captures
        run: |
          flutter pub get
          flutter gen-l10n
          export FLUTTER_ROOT="$(dirname "$(dirname "$(command -v flutter)")")"
          ls "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts"
          flutter test --tags captures --run-skipped --update-goldens test/captures

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: captures
          path: test/captures/png/*.png
          if-no-files-found: error
